[project]
name = "myassistantbet"
version = "0.1.0"
description = "Collecte de matchs et de cotes, et generation d'un prompt d'analyse sportive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "jinja2>=3.1,<4",
    "httpx>=0.28,<0.29",
    "apscheduler>=3.11,<4",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<0.1",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<0.26",
    "pytest-cov>=7.1.0",
    "respx>=0.22,<0.23",
    "ruff>=0.9,<0.10",
]

[project.scripts]
myassistantbet-backup = "myassistantbet.backup:main"
myassistantbet-replay = "myassistantbet.replay:main"
myassistantbet-replay-api = "myassistantbet.replay_api:main"
myassistantbet-selfcheck = "myassistantbet.selfcheck:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myassistantbet"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
filterwarnings = ["error"]
